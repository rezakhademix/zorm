services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: zorm
      POSTGRES_PASSWORD: zorm
      POSTGRES_DB: zorm_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zorm", "-d", "zorm_test"]
      interval: 1s
      timeout: 3s
      retries: 30
